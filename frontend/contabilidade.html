<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contabilidade - Atlas Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-chart-pie"></i>
                <span>Atlas Financeiro</span>
            </div>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="lancamentos.html">Lançamentos</a>
                <a href="faturas.html">Faturas</a>
                <a href="energia.html">Energia</a>
                <a href="grupos.html">Grupos</a>
                <a href="contabilidade.html" class="active">Contabilidade</a>
                <a href="#" onclick="logout(event)" class="btn btn-danger">Sair</a>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="container main-content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-chart-line"></i> Contabilidade</h1>
                <p class="text-muted">Plano de contas e análises financeiras</p>
            </div>
            <button class="btn btn-primary" onclick="abrirModalPlanoConta()">
                <i class="fas fa-plus"></i> Nova Conta
            </button>
        </div>

        <!-- Plano de Contas -->
        <div class="card">
            <div class="card-header">
                <h3>Plano de Contas</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th>Nível</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="planoContasTable">
                            <tr>
                                <td colspan="5" class="text-center text-muted">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Balanço Período -->
        <div class="card">
            <div class="card-header">
                <h3>Balanço do Período</h3>
            </div>
            <div class="card-body">
                <div class="form-row" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label>Data Início</label>
                        <input type="date" id="balancoDataInicio">
                    </div>
                    <div class="form-group">
                        <label>Data Fim</label>
                        <input type="date" id="balancoDataFim">
                    </div>
                    <div class="form-group" style="align-self: flex-end;">
                        <button class="btn btn-primary" onclick="carregarBalanco()">
                            <i class="fas fa-calculator"></i> Calcular
                        </button>
                    </div>
                </div>
                <div id="balancoResultados" style="display: none;">
                    <div class="balanco-cards">
                        <div class="balanco-item success">
                            <span class="label">Total Receitas</span>
                            <span class="value" id="balancoReceitas">R$ 0,00</span>
                        </div>
                        <div class="balanco-item danger">
                            <span class="label">Total Despesas</span>
                            <span class="value" id="balancoDespesas">R$ 0,00</span>
                        </div>
                        <div class="balanco-item primary">
                            <span class="label">Saldo</span>
                            <span class="value" id="balancoSaldo">R$ 0,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Plano de Contas -->
    <div id="modalPlanoConta" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nova Conta</h3>
                <button class="modal-close" onclick="fecharModal('modalPlanoConta')">&times;</button>
            </div>
            <form id="formPlanoConta" onsubmit="salvarPlanoConta(event)">
                <div class="form-group">
                    <label>Código</label>
                    <input type="text" id="planoContaCodigo" placeholder="Ex: 1.1.01" required>
                </div>
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="planoContaNome" placeholder="Nome da conta" required>
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="planoContaTipo" required>
                        <option value="ativo">Ativo</option>
                        <option value="passivo">Passivo</option>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nível</label>
                    <input type="number" id="planoContaNivel" value="1" min="1">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="fecharModal('modalPlanoConta')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/contabilidade.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
