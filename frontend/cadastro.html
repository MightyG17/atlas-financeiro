<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Atlas Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-chart-pie"></i>
                    <span>Atlas Financeiro</span>
                </div>
                <h2>Criar Conta</h2>
                <p>Comece sua jornada de gestão financeira</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="nome">
                        <i class="fas fa-user"></i> Nome Completo
                    </label>
                    <input type="text" id="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', 'eyeIcon1')">
                            <i class="fas fa-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-check-circle"></i> Confirmar Senha
                    </label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" placeholder="Digite a senha novamente" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                            <i class="fas fa-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        Li e aceito os <a href="#" target="_blank">Termos de Serviço</a> e <a href="#" target="_blank">Política de Privacidade</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>

            <div id="registerError" class="error-message" style="display: none;"></div>
            <div id="registerSuccess" class="success-message" style="display: none;"></div>

            <div class="auth-footer">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassword(inputId, iconId) {
            const password = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const errorEl = document.getElementById('registerError');
            const successEl = document.getElementById('registerSuccess');

            // Validações
            if (password !== confirmPassword) {
                errorEl.textContent = 'As senhas não coincidem';
                errorEl.style.display = 'block';
                successEl.style.display = 'none';
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = 'A senha deve ter pelo menos 6 caracteres';
                errorEl.style.display = 'block';
                successEl.style.display = 'none';
                return;
            }

            if (!terms) {
                errorEl.textContent = 'Você deve aceitar os termos de serviço';
                errorEl.style.display = 'block';
                successEl.style.display = 'none';
                return;
            }

            try {
                const response = await cadastrar(nome, email, password);
                
                if (response.success) {
                    successEl.textContent = 'Conta criada com sucesso! Redirecionando...';
                    successEl.style.display = 'block';
                    errorEl.style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    errorEl.textContent = response.message || 'Erro ao criar conta';
                    errorEl.style.display = 'block';
                    successEl.style.display = 'none';
                }
            } catch (error) {
                errorEl.textContent = 'Erro de conexão. Verifique sua internet.';
                errorEl.style.display = 'block';
                successEl.style.display = 'none';
            }
        }
    </script>
</body>
</html>
