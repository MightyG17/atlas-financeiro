<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Atlas Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-chart-pie"></i>
                    <span>Atlas Financeiro</span>
                </div>
                <h2>Bem-vindo de volta</h2>
                <p>Faça login para acessar sua conta</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div id="loginError" class="error-message" style="display: none;"></div>

            <div class="auth-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se gratuitamente</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
<script>
    // ============================================
    // ✅ FUNÇÃO DE MOSTRAR/ESCONDER SENHA
    // ============================================
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }

    // ============================================
    // ✅ LOGIN COM SALVAMENTO DE DADOS
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('loginForm');

        if (loginForm) {
            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorAlert = document.getElementById('loginError');

                // Oculta mensagem de erro
                errorAlert.style.display = 'none';

                try {
                    // Chama a API de login
                    const result = await window.api.login(email, password);

                    if (result.success) {
                        // ✅ ==== SALVA OS DADOS NO NAVEGADOR ====
                        // Essas 3 linhas fazem o nome aparecer e a sessão funcionar!
                        localStorage.setItem('token', result.token || result.access_token || '');
                        localStorage.setItem('usuario_nome', result.nome || result.username || result.usuario || 'Usuário');
                        localStorage.setItem('usuario_id', result.id || result.usuario_id || '');
                        // ✅ =======================================

                        // Redireciona para o Dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        // Exibe erro de login
                        errorAlert.textContent = result.message || 'E-mail ou senha incorretos.';
                        errorAlert.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Erro na autenticação:', err);
                    errorAlert.textContent = 'Erro ao conectar com o servidor. Verifique sua conexão.';
                    errorAlert.style.display = 'block';
                }
            });
        }
    });
</script>
</body>
</html>
