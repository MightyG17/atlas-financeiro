<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Atlas Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-chart-pie"></i>
                    <span>Atlas Financeiro</span>
                </div>
                <h2>Bem-vindo de volta</h2>
                <p>Faça login para acessar sua conta</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div id="loginError" class="error-message" style="display: none;"></div>

            <div class="auth-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se gratuitamente</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('loginForm'); // Garanta que a tag <form id="loginForm"> tem esse ID

        if (loginForm) {
            loginForm.addEventListener('submit', async (event) => {
                // 1. OBRIGATÓRIO: Impede a página de atualizar no submit
                event.preventDefault();

                // Captura os valores dos campos
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password') || document.getElementById('senha');
                const errorAlert = document.getElementById('errorMessage') || document.getElementById('loginError');

                const email = emailInput ? emailInput.value : '';
                const password = passwordInput ? passwordInput.value : '';

                // Oculta mensagens de erro anteriores
                if (errorAlert) errorAlert.style.display = 'none';

                try {
                    // Chama a função login do api.js
                    const result = await window.api.login(email, password);

                    if (result.success) {
                        // Sucesso: Redireciona para a página principal
                        window.location.href = 'dashboard.html';
                    } else {
                        // Exibe a mensagem de erro retornada pela API (ex: "E-mail ou senha incorretos")
                        if (errorAlert) {
                            errorAlert.textContent = result.message || 'Falha ao realizar login.';
                            errorAlert.style.display = 'block';
                        } else {
                            alert(result.message || 'Falha ao realizar login.');
                        }
                    }
                } catch (err) {
                    console.error('Erro na autenticação:', err);
                    if (errorAlert) {
                        errorAlert.textContent = 'Erro ao se conectar com o servidor.';
                        errorAlert.style.display = 'block';
                    }
                }
            });
        }
    });
</script>
</body>
</html>
