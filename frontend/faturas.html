<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturas - Atlas Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-chart-pie"></i>
                <span>Atlas Financeiro</span>
            </div>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="lancamentos.html">Lançamentos</a>
                <a href="faturas.html" class="active">Faturas</a>
                <a href="energia.html">Energia</a>
                <a href="grupos.html">Grupos</a>
                <a href="contabilidade.html">Contabilidade</a>
                <a href="#" onclick="logout(event)" class="btn btn-danger">Sair</a>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="container main-content">
        <div class="page-header">
            <div>
                <h1>Faturas</h1>
                <p class="text-muted">Gerencie todas as suas faturas e contas</p>
            </div>
            <button class="btn btn-primary" onclick="abrirModalFatura()">
                <i class="fas fa-plus"></i> Nova Fatura
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Cód. Barras</th>
                                <th>Valor</th>
                                <th>Vencimento</th>
                                <th>Status</th>
                                <th>Categoria</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="faturasTable">
                            <tr>
                                <td colspan="6" class="text-center text-muted">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nova Fatura -->
    <div id="modalFatura" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalFaturaTitle">Nova Fatura</h3>
                <button class="modal-close" onclick="fecharModal('modalFatura')">&times;</button>
            </div>
            <form id="formFatura" onsubmit="salvarFatura(event)">
                <input type="hidden" id="faturaId">
                
                <div class="form-group">
                    <label>Código de Barras</label>
                    <input type="text" id="faturaCodigo" placeholder="Código de barras da fatura" required>
                </div>

                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="faturaValor" step="0.01" min="0.01" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Data de Vencimento</label>
                        <input type="date" id="faturaVencimento" required>
                    </div>
                    <div class="form-group">
                        <label>Data de Pagamento</label>
                        <input type="date" id="faturaPagamento">
                    </div>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="faturaStatus">
                        <option value="pendente">Pendente</option>
                        <option value="pago">Pago</option>
                        <option value="vencido">Vencido</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" id="faturaCategoria" placeholder="Ex: Energia, Água, Internet...">
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="faturaDescricao" rows="2" placeholder="Descrição adicional"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="fecharModal('modalFatura')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/faturas.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
